<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #eee3c5;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* ---------- VIDEO SUPERIOR ---------- */
    /* El video ocupa como máximo 1/3 de la pantalla visible */
    .video-box {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .video-box video {
      width: auto;
      max-width: 100%;
      height: 33vh;          /* 1/3 de la altura visible del celular */
      max-height: 33vh;
      border-radius: 12px;
      display: block;
      object-fit: cover;
      background: #000;
    }

    /* Botón de sonido discreto, flotando sobre el video */
    .btn-sonido {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .btn-sonido:hover { background: rgba(0, 0, 0, 0.75); }
    .btn-sonido:focus {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    /* ---------- IMAGEN DEL MENÚ ---------- */
    .menu-img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      border: 2px solid #d32f2f;
    }

    /* ---------- TEXTO FINAL ---------- */
    .aviso-final {
      margin-top: 1.5rem;
      padding: 1rem;
      text-align: center;
      background: #fff8e1;
      border-left: 5px solid #d32f2f;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Respeta "reducir movimiento" */
    @media (prefers-reduced-motion: reduce) {
      .video-box video { /* los videos sí se pueden pausar vía JS, ver abajo */ }
    }
  </style>
</head>
<body>

  <!-- VIDEO SUPERIOR -->
  <div class="video-box">
    <video
      id="miVideo"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      aria-label="Video de presentación. Pulsa el botón para activar o silenciar el sonido.">
      <source src="Lacalabaza.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>

    <!-- Botón discreto de sonido -->
    <button
      class="btn-sonido"
      id="btnSonido"
      aria-pressed="false"
      aria-label="Activar sonido">
      🔊
    </button>
  </div>

  <!-- IMAGEN DEL MENÚ -->
  <img
    class="menu-img"
    src="menu.jpg"
    alt="Menú de refrescos: Coca-Cola 600 ml a 23 pesos, Coca-Cola Chubby 355 ml a 16 pesos, Coca-Cola Chubby Zero 355 ml a 13 pesos, Topo Chico Original 600 ml a 25 pesos, Topo Chico Limonada 600 ml a 25 pesos, Topo Chico Naranjada 600 ml a 25 pesos.">

  <!-- AVISO FINAL -->
  <p class="aviso-final">
    📍 Encuéntranos en el último piso, subiendo las escaleras del lado derecho.
  </p>

  <script>
    const video = document.getElementById('miVideo');
    const btn = document.getElementById('btnSonido');

    // Intento de autoplay con sonido (casi siempre fallará en móvil, pero lo intentamos)
    video.volume = 1;

    btn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => {});
        btn.textContent = '🔇';
        btn.setAttribute('aria-label', 'Silenciar');
        btn.setAttribute('aria-pressed', 'true');
      } else {
        video.muted = true;
        btn.textContent = '🔊';
        btn.setAttribute('aria-label', 'Activar sonido');
        btn.setAttribute('aria-pressed', 'false');
      }
    });

    // Si el navegador pausa el video por autoplay bloqueado, lo reintentamos mudo
    video.addEventListener('pause', () => {
      // Solo si el usuario no lo pausó manualmente (no tenemos forma fiable de saberlo,
      // pero como no hay controles visibles, si se pausa es por el navegador)
      video.play().catch(() => {});
    });

    // Respeta "reducir movimiento"
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      video.autoplay = false;
      video.pause();
    }
  </script>

</body>
</html>
